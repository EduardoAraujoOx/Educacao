name: Rodar Censo ES Tempo Integral

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'outputs/**'
      - 'run-trigger.txt'

permissions:
  contents: write

jobs:
  processar-censo:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restaurar cache dos microdados baixados
        uses: actions/cache@v4
        with:
          path: data/raw
          key: censo-escolar-inep-2015-2025-v1

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tabulate

      - name: Processar microdados do Censo Escolar
        run: python scripts/01_processar_censo_es.py

      - name: Gerar base escola-ano e coortes
        run: python scripts/05_gerar_base_escola_ano.py

      - name: Gerar gráficos
        run: python scripts/02_gerar_graficos.py

      - name: Gerar página Markdown de resultados
        run: python scripts/03_gerar_markdown_resultados.py

      - name: Gerar site HTML
        run: python scripts/04_gerar_site.py

      - name: Gerar página de metodologia escalonada
        run: python scripts/06_gerar_site_metodologia.py

      - name: Publicar resultados como artefato
        uses: actions/upload-artifact@v4
        with:
          name: resultados-censo-es-tempo-integral
          path: |
            outputs/
            docs/

      - name: Salvar resultados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/ docs/
          if git diff --cached --quiet; then
            echo "Nenhuma alteração em outputs/ ou docs/."
            exit 0
          fi
          git commit -m "Atualizar resultados Censo ES Tempo Integral"
          git pull --rebase origin main
          git push origin HEAD:main
