name: Rodar Censo ES Tempo Integral

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'outputs/**'
      - 'run-trigger.txt'

permissions:
  contents: write

jobs:
  processar-censo:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tabulate

      - name: Processar microdados do Censo Escolar
        run: python scripts/01_processar_censo_es.py

      - name: Gerar gráficos
        run: python scripts/02_gerar_graficos.py

      - name: Gerar página Markdown de resultados
        run: python scripts/03_gerar_markdown_resultados.py

      - name: Publicar resultados como artefato
        uses: actions/upload-artifact@v4
        with:
          name: resultados-censo-es-tempo-integral
          path: outputs/

      - name: Salvar resultados no repositório
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Atualizar resultados Censo ES Tempo Integral
          file_pattern: outputs/**
